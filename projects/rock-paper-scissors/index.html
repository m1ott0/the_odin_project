<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="javascript.js" defer></script>
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tabela">
        <form id="formulario">
        <div class="user">
        <label for="username" id="label">Username:</label>
        <input
        id="username"
        placeholder="ex:Username123"
        maxlength="12"
        type="text"
        required>
        </div>
        <button id="submit" type="submit">Confirm</button>
    </form>
        <div class="title">ROCK PAPER SCISSORS</div>
        <div class="title2">Choose your move!</div>
        <div id="options">
            <div class="round-options">
            <div><button id="rock" class="r-buttons">🪨</button></div>
            <div class="emoji-txt">Rock</div>
            </div>
            <div class="round-options">
            <div><button id="paper" class="r-buttons">📄</button></div>
            <div class="emoji-txt">Paper</div>
            </div>
            <div class="round-options">
            <div><button id="scissors" class="r-buttons">✂️</button></div>
            <div class="emoji-txt">Scissors</div>
            </div>
        </div>
        <div id="score-title">SCORE</div>
        <div class="score">
            <div class="round-score">
            <div id="playerName">PLAYER</div>
            <div id="playerScore">0</div>
            </div>
            <div class="round-score">
                <div>COMPUTER</div>
                <div id="computerScore">0</div>
            </div>
        </div>
        <div>ROUND RESULT</div>
        <div id="roundResult">Waiting for your choice...</div>
        <button id="restart">RESTART THE GAME</button>
    </div>
</body>
</html>
