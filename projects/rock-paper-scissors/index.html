<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="javascript.js" defer></script>
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tabela">
        <div>ROCK PAPER SCISSORS</div>
        <div>Choose your move!</div>
        <div id="options">
            <div class="round-options"><button>🪨</button>
            <div>Rock</div>
            <div class="round-options"><button>📄</button>
            <div>Paper</div>
            <div class="round-options"><button>✂️</button>
            <div>Scissors</div>
        </div>
        </div>
        <div>SCORE</div>
        <div class="score">
            <div class="round-score">
            <div>YOU</div>
            <div id="p-score">0</div>
            </div>
            <div class="round-score">
                <div>-</div>
            </div>
            <div class="round-score">
                <div>COMPUTER</div>
                <div>0</div>
            </div>
        </div>
        <div>ROUND RESULT</div>
        <div id="final-result">Waiting for your choice...</div>
        <button>RESTART THE GAME</button>
    </div>
</body>
</html>
