<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/projects/calculator/images/icon.png">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Ephesis&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator">
     <div class="upper">
    <div class="fancy">
        <div class="fancyTitle">Calculator</div>
        <div class="fancyDisplay">       
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
    </div>
    </div>
    <div class="display">
    <div class="record">
    </div>
    <div class="panel"></div>
    </div>
</div>
    <div class="buttons">
     <div class="firstColumn">
       <button class="clear" id="AC">AC</button>
       <button class="numbers">7</button>
       <button class="numbers">4</button>
       <button class="numbers">1</button>
       <button class="numbers">0</button>
     </div>
     <div class="secondColumn">
       <button class="delete" id="DEL">DEL</button>
       <button class="numbers">8</button>
       <button class="numbers">5</button>
       <button class="numbers">2</button>
       <button class="dot">.</button>
    </div>
    <div class="thirdColumn">
       <button class="operators">÷</button>
       <button class="numbers">9</button>
       <button class="numbers">6</button>
       <button class="numbers">3</button>
       <button class="change">+/-</button>
    </div>
    <div class="fourthColumn">
       <button class="operators">x</button>
       <button class="operators">+</button>
       <button class="operators">-</button>
       <button class="equal" id="equalButton">=</button>
    </div>
</div>
</div>
<div class="footer">
<div class="credits">© 2026 <a href="https://github.com/m1ott0" target="_blank" title="go to GitHub profile" class="link">@m1otto</a> · Designed & developed · </div>
<div class="profile"><a href="https://github.com/m1ott0/the_odin_project/tree/main/projects/calculator" target="_blank" title="go to GitHub repository" class="link"><img src="images/github.png"></a></div>
</div>
</body>
</html>
